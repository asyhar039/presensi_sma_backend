services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        PHP_VERSION: "8.5"
        NODE_VERSION: "26"
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-attendance}"
      DB_USERNAME: "${DB_USERNAME:-attendance}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      APP_URL: "http://localhost:${APP_PORT:-8000}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - attendance

  mysql:
    image: mysql:8.0
    container_name: attendance-mysql
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-password}"
      MYSQL_DATABASE: "${DB_DATABASE:-attendance}"
      MYSQL_USER: "${DB_USERNAME:-attendance}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - attendance
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
    driver: local

networks:
  attendance:
    driver: bridge
