server {
    # Render exposes the HTTP port through $PORT.
    # The startup script will generate the actual configuration.
    listen 10000;

    server_name _;

    root /var/www/html/public;

    index index.php;

    # Laravel front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM.
    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_pass 127.0.0.1:9000;

        fastcgi_read_timeout 60;
    }

    # Never expose hidden files.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Do not expose application logs or environment files.
    location ~* \.(env|log|sql|sqlite)$ {
        deny all;
    }

    # Laravel health endpoint should remain inexpensive.
    location = /health {
        try_files $uri /index.php?$query_string;
    }
}