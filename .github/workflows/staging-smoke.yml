name: Staging Smoke Test

on:

  push:
    branches:
      - staging

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:

  smoke-test:

    name: Staging Smoke Test

    runs-on: ubuntu-24.04

    steps:

      - name: Wait for Railway deployment
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |

          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL is not configured."
            exit 1
          fi

          echo "Waiting for staging..."

          for i in {1..60}; do

            STATUS=$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 10 \
                "${STAGING_URL}/health" \
                || true
            )

            echo "Attempt ${i}: HTTP ${STATUS}"

            if [ "$STATUS" = "200" ]; then
              echo "Staging is healthy."
              exit 0
            fi

            sleep 10

          done

          echo "Staging did not become healthy."
          exit 1


      - name: Health check
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |

          curl \
            --fail \
            --silent \
            --show-error \
            "${STAGING_URL}/health"


      - name: API smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |

          curl \
            --fail \
            --silent \
            --show-error \
            "${STAGING_URL}/api/health"
